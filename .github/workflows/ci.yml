name: "Test"
on:
  workflow_dispatch:
  pull_request:
    types: [opened,edited,synchronize,reopened]
  push:
    branches:
      - 'master'
jobs:
  nix:
    name: Nix build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    if: github.repository_owner == 'artturin'
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
    - run: nix build --extra-experimental-features nix-command -L --show-trace
  ubuntu:
    name: Ubuntu build (apt packages)
    runs-on: ubuntu-latest
    if: github.repository_owner == 'artturin'
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          meson ninja-build gcc g++ pkg-config gettext \
          libgtk-3-dev libglib2.0-dev libgdk-pixbuf-2.0-dev libexiv2-dev \
          shared-mime-info desktop-file-utils xvfb xauth
    - run: meson setup builddir
    - run: meson compile -C builddir
    - run: meson test -C builddir --print-errorlogs
    - run: DESTDIR="$PWD/destdir" meson install -C builddir

name: "Test"
on:
  workflow_dispatch:
  pull_request:
    types: [opened,edited,synchronize,reopened]
  push:
    branches:
      - 'master'
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    if: github.repository_owner == 'artturin'
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
    - run: nix build --extra-experimental-features nix-command -L --show-trace
